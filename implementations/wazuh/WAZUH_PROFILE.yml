profile:
  id: wazuh
  name: Wazuh Implementation and Evidence Profile
  version: 0.4.0-draft
  profile_type:
  - implementation
  - evidence
  - continuous_monitoring
  boundary_statement: Wazuh evaluates technical tests and collects evidence; it does not determine legal compliance.
capabilities:
  sca:
    purpose: Configuration assessment and baseline testing
    supports:
    - REQ-CFG-001
    - REQ-IAM-001
    - REQ-NET-001
    - REQ-CRY-001
    - REQ-CRY-002
    - REQ-LOG-002
  fim:
    purpose: File/configuration integrity and change evidence
    supports:
    - REQ-CFG-002
    - REQ-INT-001
    - REQ-RET-002
  log_analysis:
    purpose: Collect, decode, correlate and alert on system/application/security logs
    supports:
    - REQ-LOG-001
    - REQ-MON-001
    - REQ-MON-002
    - REQ-INC-001
    - REQ-INC-002
    - REQ-PRC-001
  vulnerability_detection:
    purpose: Identify vulnerable software/packages on monitored endpoints
    supports:
    - REQ-VUL-001
    - REQ-VUL-002
  syscollector:
    purpose: Endpoint inventory context for software/system observations
    supports:
    - REQ-INV-002
    - REQ-VUL-001
  agent_labels:
    purpose: Attach PDP contextual metadata to agent-generated alerts
    supports:
    - REQ-INV-002
    - REQ-EVD-001
  agent_groups:
    purpose: Apply profile-specific centralized configuration to scoped assets
    supports:
    - REQ-CFG-001
    - REQ-INV-002
  active_response:
    purpose: Optional automated containment actions after approved design
    supports:
    - REQ-INC-001
    guardrail: Active response is an operational security action, not a legal compliance decision.
context_labels:
  recommended:
  - pdp.asset_id
  - pdp.processing_activity_id
  - pdp.data_classification
  - pdp.criticality
  - pdp.organization_role
  - pdp.environment
  avoid:
  - raw personal data
  - names of data subjects
  - sensitive identifiers
  - legal conclusions such as compliant/non_compliant
