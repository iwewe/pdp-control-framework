<agent_config os="^Linux">
  <!-- Database profile overlay. Replace log locations with database-specific paths. -->

  <labels>
    <label key="pdp.profile.database">PDP-PROFILE-DATABASE</label>
  </labels>

  <localfile>
    <location>/var/log/postgresql/postgresql-*.log</location>
    <log_format>syslog</log_format>
  </localfile>

  <syscheck>
    <directories realtime="yes" whodata="yes">/etc/postgresql</directories>
  </syscheck>
</agent_config>
