<agent_config os="^Linux">
  <!-- PDP Control Framework Linux baseline. Review paths before production deployment. -->

  <labels>
    <label key="pdp.profile">PDP-PROFILE-BASELINE</label>
    <label key="pdp.environment">on-premise</label>
    <!-- pdp.asset_id and pdp.processing_activity_id are deliberately NOT
         set here. This file is shared byte-for-byte across every agent
         in the group, so a single "real-looking" value here would be
         wrong for every host but one, which is worse than an obvious
         placeholder (it would silently misattribute evidence instead of
         visibly failing to set it). Set these two per host in that
         agent's own LOCAL ossec.conf instead; see
         implementations/wazuh/DEPLOYMENT.md section 2, "Per-host asset
         labels", for the exact snippet and an important caveat: whether
         a local label here actually overrides (vs. duplicates) this
         group's same-keyed label has not been verified in this lab and
         must be checked on the first real host before a multi-host
         rollout. -->
  </labels>

  <syscheck>
    <frequency>43200</frequency>
    <directories realtime="yes" whodata="yes">/etc/ssh,/etc/audit</directories>
    <directories realtime="yes" whodata="yes">/etc/systemd,/etc/cron.d</directories>
  </syscheck>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <policies>
      <policy enabled="yes">/var/ossec/etc/shared/pdp_linux_baseline.yml</policy>
    </policies>
  </sca>

  <!-- syscollector is intentionally NOT set here. Wazuh 4.14.7 rejects it
       inside a centralized/shared agent.conf ("Invalid element in the
       configuration: 'syscollector'"), and that single invalid element
       invalidates the ENTIRE agent.conf for the group: labels, syscheck,
       and sca above all silently stop applying too, not just syscollector.
       Confirmed on real Wazuh 4.14.7, 2026-09-23; see
       release/runtime-validation/wazuh-4.14.7/AGENT_CONF_EVIDENCE_2026-09-23.md.
       Configure syscollector locally in each agent's own ossec.conf instead. -->
</agent_config>
