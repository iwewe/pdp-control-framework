metadata:
  framework: PDP Control Framework
  version: 1.0.0
  jurisdiction: Indonesia
  primary_instrument: UU No. 27 Tahun 2022 tentang Pelindungan Data Pribadi
  authoritative_source: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
  review_type: authoritative-text source review
  review_date: '2026-09-22'
  legal_counsel_review: NOT_PERFORMED
  requirement_summary_disclaimer: >-
    Every requirement_summary below is the framework's own condensed
    paraphrase for engineering traceability purposes. It is not verbatim
    statutory text and is not a substitute for the authoritative source.
    Read the cited article/paragraph at authoritative_source (or each
    entry's legal_source.source_url / pdf_page) for the exact statutory
    wording before relying on a requirement_summary for a legal
    conclusion.
  interpretation_notes:
  - instrument: Putusan MK 151/PUU-XXII/2024
    decision_date: '2025-07-30'
    source: https://www.mkri.id/perkara/persidangan/putusan?jenis=PUU&page=1&perPage=50&search=151%2FPUU-XXII%2F2024
    affects:
    - Pasal 53 ayat (1) huruf b
    effect: Kata 'dan' tidak mempunyai kekuatan hukum mengikat secara bersyarat sepanjang tidak dimaknai 'dan/atau'.
requirements:
- id: LR-020-01
  legal_source:
    instrument: UU-27-2022
    article: 20
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 1
    pdf_page: 10
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib memiliki dasar pemrosesan Data Pribadi.
  mapped_controls:
  - PDP-LAW-001
  source_review_status: SOURCE_VERIFIED
- id: LR-020-02
  legal_source:
    instrument: UU-27-2022
    article: 20
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 2
    pdf_page: 11
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: 'Dasar pemrosesan harus sesuai dengan salah satu dasar yang diakui UU: persetujuan eksplisit, perjanjian,
    kewajiban hukum, kepentingan vital, kepentingan umum/pelayanan publik/kewenangan, dan/atau kepentingan sah dengan penyeimbangan
    kepentingan.'
  mapped_controls:
  - PDP-LAW-001
  source_review_status: SOURCE_VERIFIED
- id: LR-021-01
  legal_source:
    instrument: UU-27-2022
    article: 21
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 1
    pdf_page: 11
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Jika pemrosesan didasarkan pada persetujuan, Pengendali wajib memberikan informasi yang diwajibkan
    mengenai legalitas, tujuan, jenis/relevansi data, retensi, rincian informasi, jangka waktu pemrosesan, dan hak Subjek
    Data.
  mapped_controls:
  - PDP-CNS-001
  - PDP-LAW-002
  source_review_status: SOURCE_VERIFIED
- id: LR-021-02
  legal_source:
    instrument: UU-27-2022
    article: 21
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 2
    pdf_page: 12
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Jika informasi persetujuan berubah, Pengendali wajib memberitahukan perubahan kepada Subjek Data sebelum
    perubahan tersebut terjadi.
  mapped_controls:
  - PDP-CNS-001
  source_review_status: SOURCE_VERIFIED
- id: LR-022-01
  legal_source:
    instrument: UU-27-2022
    article: 22
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 1
    pdf_page: 12
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Persetujuan pemrosesan dilakukan secara tertulis atau terekam dan dapat disampaikan secara elektronik
    atau nonelektronik.
  mapped_controls:
  - PDP-CNS-002
  source_review_status: SOURCE_VERIFIED
- id: LR-022-02
  legal_source:
    instrument: UU-27-2022
    article: 22
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 4
    pdf_page: 12
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Jika permintaan persetujuan memuat tujuan lain, permintaan tersebut harus dapat dibedakan secara jelas,
    mudah dipahami dan diakses, serta menggunakan bahasa sederhana dan jelas.
  mapped_controls:
  - PDP-CNS-002
  source_review_status: SOURCE_VERIFIED
- id: LR-022-03
  legal_source:
    instrument: UU-27-2022
    article: 22
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 5
    pdf_page: 12
  actor: Pengendali Data Pribadi
  requirement_type: validity_condition
  requirement_summary: Persetujuan yang tidak memenuhi ketentuan bentuk dan pemisahan tujuan yang diwajibkan UU batal demi
    hukum.
  mapped_controls:
  - PDP-CNS-002
  source_review_status: SOURCE_VERIFIED
- id: LR-023-01
  legal_source:
    instrument: UU-27-2022
    article: 23
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    pdf_page: 12
  actor: Pengendali Data Pribadi
  requirement_type: validity_condition
  requirement_summary: Klausul perjanjian yang meminta pemrosesan Data Pribadi tanpa persetujuan sah secara eksplisit dari
    Subjek Data batal demi hukum.
  mapped_controls:
  - PDP-CNS-002
  source_review_status: SOURCE_VERIFIED
- id: LR-024-01
  legal_source:
    instrument: UU-27-2022
    article: 24
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    pdf_page: 12
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Dalam melakukan pemrosesan, Pengendali wajib dapat menunjukkan bukti persetujuan yang diberikan Subjek
    Data.
  mapped_controls:
  - PDP-CNS-002
  source_review_status: SOURCE_VERIFIED
- id: LR-025-01
  legal_source:
    instrument: UU-27-2022
    article: 25
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 1
    pdf_page: 13
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pemrosesan Data Pribadi anak diselenggarakan secara khusus.
  mapped_controls:
  - PDP-CNS-003
  source_review_status: SOURCE_VERIFIED
- id: LR-025-02
  legal_source:
    instrument: UU-27-2022
    article: 25
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 2
    pdf_page: 13
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pemrosesan Data Pribadi anak wajib mendapat persetujuan orang tua dan/atau wali sesuai peraturan perundang-undangan.
  mapped_controls:
  - PDP-CNS-003
  source_review_status: SOURCE_VERIFIED
- id: LR-026-01
  legal_source:
    instrument: UU-27-2022
    article: 26
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 1
    pdf_page: 13
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pemrosesan Data Pribadi penyandang disabilitas diselenggarakan secara khusus.
  mapped_controls:
  - PDP-CNS-004
  source_review_status: SOURCE_VERIFIED
- id: LR-026-02
  legal_source:
    instrument: UU-27-2022
    article: 26
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 2
    pdf_page: 13
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pemrosesan Data Pribadi penyandang disabilitas dilakukan melalui komunikasi dengan cara tertentu sesuai
    peraturan perundang-undangan.
  mapped_controls:
  - PDP-CNS-004
  source_review_status: SOURCE_VERIFIED
- id: LR-026-03
  legal_source:
    instrument: UU-27-2022
    article: 26
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 3
    pdf_page: 13
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pemrosesan Data Pribadi penyandang disabilitas wajib mendapat persetujuan penyandang disabilitas dan/atau
    walinya sesuai peraturan perundang-undangan.
  mapped_controls:
  - PDP-CNS-004
  source_review_status: SOURCE_VERIFIED
- id: LR-027-01
  legal_source:
    instrument: UU-27-2022
    article: 27
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    pdf_page: 13
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib melakukan pemrosesan secara terbatas dan spesifik, sah secara hukum, dan transparan.
  mapped_controls:
  - PDP-LAW-002
  source_review_status: SOURCE_VERIFIED
- id: LR-028-01
  legal_source:
    instrument: UU-27-2022
    article: 28
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    pdf_page: 13
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib melakukan pemrosesan sesuai dengan tujuan pemrosesan Data Pribadi.
  mapped_controls:
  - PDP-LAW-002
  source_review_status: SOURCE_VERIFIED
- id: LR-029-01
  legal_source:
    instrument: UU-27-2022
    article: 29
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 1
    pdf_page: 13
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib memastikan akurasi, kelengkapan, dan konsistensi Data Pribadi.
  mapped_controls:
  - PDP-DATA-001
  source_review_status: SOURCE_VERIFIED
- id: LR-029-02
  legal_source:
    instrument: UU-27-2022
    article: 29
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 2
    pdf_page: 14
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Untuk memastikan akurasi, kelengkapan, dan konsistensi, Pengendali wajib melakukan verifikasi.
  mapped_controls:
  - PDP-DATA-001
  source_review_status: SOURCE_VERIFIED
- id: LR-030-01
  legal_source:
    instrument: UU-27-2022
    article: 30
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 1
    pdf_page: 14
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib memperbarui dan/atau memperbaiki kesalahan/ketidakakuratan paling lambat 3 x 24 jam
    sejak menerima permintaan.
  mapped_controls:
  - PDP-RGT-001
  source_review_status: SOURCE_VERIFIED
- id: LR-030-02
  legal_source:
    instrument: UU-27-2022
    article: 30
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 2
    pdf_page: 14
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib memberitahukan hasil pembaruan dan/atau perbaikan kepada Subjek Data.
  mapped_controls:
  - PDP-RGT-001
  source_review_status: SOURCE_VERIFIED
- id: LR-031-01
  legal_source:
    instrument: UU-27-2022
    article: 31
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    pdf_page: 14
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib melakukan perekaman terhadap seluruh kegiatan pemrosesan Data Pribadi.
  mapped_controls:
  - PDP-LOG-001
  - PDP-GOV-001
  source_review_status: SOURCE_VERIFIED
- id: LR-032-01
  legal_source:
    instrument: UU-27-2022
    article: 32
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 1
    pdf_page: 14
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib memberikan akses kepada Subjek Data terhadap Data Pribadi yang diproses beserta rekam
    jejak pemrosesan sesuai jangka waktu penyimpanan.
  mapped_controls:
  - PDP-RGT-002
  - PDP-LOG-001
  source_review_status: SOURCE_VERIFIED
- id: LR-032-02
  legal_source:
    instrument: UU-27-2022
    article: 32
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 2
    pdf_page: 14
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Akses wajib diberikan paling lambat 3 x 24 jam sejak permintaan akses diterima.
  mapped_controls:
  - PDP-RGT-002
  source_review_status: SOURCE_VERIFIED
- id: LR-033-01
  legal_source:
    instrument: UU-27-2022
    article: 33
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    pdf_page: 14
  actor: Pengendali Data Pribadi
  requirement_type: obligation_with_conditions
  requirement_summary: Pengendali wajib menolak akses perubahan Data Pribadi dalam kondisi yang ditetapkan UU, termasuk risiko
    terhadap keamanan/kesehatan, pengungkapan Data Pribadi orang lain, dan kepentingan pertahanan/keamanan nasional.
  mapped_controls:
  - PDP-RGT-002
  source_review_status: SOURCE_VERIFIED
- id: LR-034-01
  legal_source:
    instrument: UU-27-2022
    article: 34
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 1
    pdf_page: 15
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib melakukan penilaian dampak Pelindungan Data Pribadi jika pemrosesan memiliki potensi
    risiko tinggi terhadap Subjek Data.
  mapped_controls:
  - PDP-DPIA-001
  - PDP-DPIA-002
  source_review_status: SOURCE_VERIFIED
- id: LR-034-02
  legal_source:
    instrument: UU-27-2022
    article: 34
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 2
    pdf_page: 15
  actor: Pengendali Data Pribadi
  requirement_type: applicability_criteria
  requirement_summary: Kategori pemrosesan berpotensi risiko tinggi mencakup keputusan otomatis berdampak signifikan, Data
    Pribadi spesifik, skala besar, evaluasi/penskoran/pemantauan sistematis, pencocokan/penggabungan data, teknologi baru,
    dan/atau pemrosesan yang membatasi hak.
  mapped_controls:
  - PDP-DPIA-001
  - PDP-DPIA-002
  source_review_status: SOURCE_VERIFIED
- id: LR-035-01
  legal_source:
    instrument: UU-27-2022
    article: 35
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    letter: a
    pdf_page: 16
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib menyusun dan menerapkan langkah teknis operasional untuk melindungi Data Pribadi dari
    gangguan pemrosesan yang bertentangan dengan peraturan perundang-undangan.
  mapped_controls:
  - PDP-SEC-001
  - PDP-SEC-003
  - PDP-LOG-001
  source_review_status: SOURCE_VERIFIED
- id: LR-035-02
  legal_source:
    instrument: UU-27-2022
    article: 35
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    letter: b
    pdf_page: 16
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib menentukan tingkat keamanan Data Pribadi dengan memperhatikan sifat dan risiko Data
    Pribadi yang harus dilindungi dalam pemrosesan.
  mapped_controls:
  - PDP-SEC-002
  - PDP-DPIA-002
  source_review_status: SOURCE_VERIFIED
- id: LR-036-01
  legal_source:
    instrument: UU-27-2022
    article: 36
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    pdf_page: 16
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Dalam melakukan pemrosesan, Pengendali wajib menjaga kerahasiaan Data Pribadi.
  mapped_controls:
  - PDP-ACC-001
  - PDP-SEC-001
  source_review_status: SOURCE_VERIFIED
- id: LR-037-01
  legal_source:
    instrument: UU-27-2022
    article: 37
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    pdf_page: 16
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib mengawasi setiap pihak yang terlibat dalam pemrosesan di bawah kendalinya.
  mapped_controls:
  - PDP-ACC-002
  - PDP-LOG-001
  source_review_status: SOURCE_VERIFIED
- id: LR-038-01
  legal_source:
    instrument: UU-27-2022
    article: 38
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    pdf_page: 16
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib melindungi Data Pribadi dari pemrosesan yang tidak sah.
  mapped_controls:
  - PDP-SEC-003
  - PDP-ACC-003
  - PDP-LOG-001
  source_review_status: SOURCE_VERIFIED
- id: LR-039-01
  legal_source:
    instrument: UU-27-2022
    article: 39
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 1
    pdf_page: 16
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib mencegah Data Pribadi diakses secara tidak sah.
  mapped_controls:
  - PDP-ACC-003
  - PDP-ACC-001
  - PDP-SEC-003
  source_review_status: SOURCE_VERIFIED
- id: LR-039-02
  legal_source:
    instrument: UU-27-2022
    article: 39
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 2
    pdf_page: 16
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pencegahan akses tidak sah dilakukan dengan sistem keamanan terhadap Data Pribadi yang diproses dan/atau
    sistem elektronik yang memproses Data Pribadi secara andal, aman, dan bertanggung jawab.
  mapped_controls:
  - PDP-ACC-003
  - PDP-SEC-001
  - PDP-SEC-003
  source_review_status: SOURCE_VERIFIED
- id: LR-040-01
  legal_source:
    instrument: UU-27-2022
    article: 40
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 1
    pdf_page: 17
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib menghentikan pemrosesan ketika Subjek Data menarik kembali persetujuan.
  mapped_controls:
  - PDP-RGT-003
  source_review_status: SOURCE_VERIFIED
- id: LR-040-02
  legal_source:
    instrument: UU-27-2022
    article: 40
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 2
    pdf_page: 17
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Penghentian pemrosesan setelah penarikan persetujuan dilakukan paling lambat 3 x 24 jam sejak permintaan
    diterima.
  mapped_controls:
  - PDP-RGT-003
  source_review_status: SOURCE_VERIFIED
- id: LR-041-01
  legal_source:
    instrument: UU-27-2022
    article: 41
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 1
    pdf_page: 17
  actor: Pengendali Data Pribadi
  requirement_type: obligation
  requirement_summary: Pengendali wajib melakukan penundaan dan pembatasan pemrosesan, sebagian atau seluruhnya, paling lambat
    3 x 24 jam sejak menerima permintaan.
  mapped_controls:
  - PDP-RGT-004
  source_review_status: SOURCE_VERIFIED
- id: LR-041-02
  legal_source:
    instrument: UU-27-2022
    article: 41
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 2
    pdf_page: 17
  actor: Pengendali Data Pribadi
  requirement_type: applicability_exception
  requirement_summary: Penundaan dan pembatasan pemrosesan tunduk pada pengecualian yang secara khusus ditetapkan dalam Pasal
    41 ayat (2).
  mapped_controls:
  - PDP-RGT-004
  source_review_status: SOURCE_VERIFIED
- id: LR-041-03
  legal_source:
    instrument: UU-27-2022
    article: 41
    source_url: https://peraturan.bpk.go.id/Download/224884/UU%20Nomor%2027%20Tahun%202022.pdf
    paragraph: 3
