<agent_config os="^Linux">
  <!-- PDP Control Framework Linux baseline. Review paths before production deployment. -->

  <labels>
    <label key="pdp.profile">PDP-PROFILE-BASELINE</label>
    <label key="pdp.environment">SET_ME</label>
    <label key="pdp.asset_id">SET_ME</label>
    <label key="pdp.processing_activity_id">SET_ME</label>
  </labels>

  <syscheck>
    <frequency>43200</frequency>
    <directories realtime="yes" whodata="yes">/etc/ssh,/etc/audit</directories>
    <directories realtime="yes" whodata="yes">/etc/systemd,/etc/cron.d</directories>
  </syscheck>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <policies>
      <policy enabled="yes">/var/ossec/etc/shared/pdp_linux_baseline.yml</policy>
    </policies>
  </sca>

  <syscollector>
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </syscollector>
</agent_config>
