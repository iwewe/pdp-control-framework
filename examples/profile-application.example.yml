metadata:
  purpose: >-
    Three realistic profile-composition examples, each showing the
    correct union of required_requirements across the profiles applied
    to one asset. effective_requirements is computed as the union of
    every applied profile's required_requirements (not
    conditional_requirements) per framework/profiles/CONTROL_PROFILES.yml.
  note: >-
    Corrected 2026-09-23: the original single example's
    effective_requirements omitted REQ-GOV-001/REQ-INV-001/REQ-INV-002/
    REQ-RET-001/REQ-RET-002, which the union of PDP-PROFILE-BASELINE +
    PDP-PROFILE-HIGH-RISK + PDP-PROFILE-DATABASE actually requires. See
    docs/architecture/applicability-model.md for the applicability model
    this composes with.
assets:
- processing_activity_id: PA-001
  asset_id: ASSET-DB-001
  asset_type: database_server
  scenario: High-risk HR database, on-premises, controller-operated
  profiles:
