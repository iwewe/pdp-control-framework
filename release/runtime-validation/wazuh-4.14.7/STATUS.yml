  range 1000-40165, nowhere near our 910001-910006 -- see the
  SCA_EVIDENCE_2026-09-23.md addendum; only non-Wazuh-authored SCA
  content remains untested, which is not exhaustively enumerable).
promotion_target: LAB_VALIDATED
