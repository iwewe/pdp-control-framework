name: Validate PDP Framework

on:
  push:
  pull_request:

jobs:
  static-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate framework structure
        run: python tools/validation/validate_structure.py

      - name: Validate lab fixtures
        run: python implementations/wazuh/tests/scripts/validate_fixtures.py


      - name: Validate evidence example
        run: |
          mkdir -p implementations/wazuh/tests/results
          cp examples/evidence.example.json implementations/wazuh/tests/results/example.evidence.json
          python tools/validation/validate_evidence.py
          rm implementations/wazuh/tests/results/example.evidence.json


      - name: Validate finding example
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator, FormatChecker
          schema=json.load(open('framework/schemas/finding.schema.json'))
          doc=json.load(open('examples/finding.example.json'))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(doc)
          print('finding example OK')
          PY

      - name: Validate control-assessment example
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator, FormatChecker
          schema=json.load(open('framework/schemas/control-assessment.schema.json'))
          doc=json.load(open('examples/control-assessment.example.json'))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(doc)
          print('control-assessment example OK')
          PY

      - name: Validate index templates
        run: |
          python - <<'PY'
          import json, glob
          for path in glob.glob('implementations/wazuh/indexer/templates/*.json'):
              json.load(open(path))
              print(path, 'OK')
          PY

      - name: Validate dashboard NDJSON is reproducible from DASHBOARD_SPEC.yml
        run: |
          python implementations/wazuh/dashboard/generate_dashboard_ndjson.py
          git diff --exit-code implementations/wazuh/dashboard/saved-objects/ || {
            echo "::error::pdp-dashboard-shell.ndjson is stale relative to DASHBOARD_SPEC.yml. Run implementations/wazuh/dashboard/generate_dashboard_ndjson.py and commit the result." >&2
            exit 1
          }

      - name: Validate dashboard NDJSON structure and references
        run: |
          python - <<'PY'
          import json
          path = 'implementations/wazuh/dashboard/saved-objects/pdp-dashboard-shell.ndjson'
          objects = [json.loads(l) for l in open(path) if l.strip()]
          ids = {o['id'] for o in objects}
          errors = []
          for o in objects:
              for ref in o.get('references', []):
                  if ref['id'] not in ids:
                      errors.append(f"{o['type']}:{o['id']} references unknown {ref['type']}:{ref['id']}")
              if o['type'] == 'dashboard':
                  panels = json.loads(o['attributes']['panelsJSON'])
                  ref_names = {r['name'] for r in o.get('references', [])}
                  for p in panels:
                      if p.get('panelRefName') and p['panelRefName'] not in ref_names:
                          errors.append(f"dashboard panel {p['panelIndex']} refName {p['panelRefName']!r} has no matching reference")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"{path}: {len(objects)} objects, all references resolve")
          PY

      - name: Validate release metadata consistency
        run: python tools/validation/validate_release_consistency.py

      - name: Check coverage report is reproducible
        run: |
          python tools/reporting/generate_coverage_report.py
          git diff --exit-code reports/ || {
            echo "::error::reports/COVERAGE_REPORT.md and/or COVERAGE_REPORT.json are stale. Run tools/reporting/generate_coverage_report.py and commit the result." >&2
            exit 1
          }
