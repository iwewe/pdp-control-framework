bugs_found_and_fixed_in_this_lab_pass:
- rule: 110101/110102 (pdp_privileged_access.xml)
  finding: >-
    No code change needed, but confirmed that the "sudo" keyword in
    110101's regex is unreachable with Wazuh's default ruleset: sudo
    command-execution events (rules 5400-5407) never carry the
    authentication_success group that 110101 requires. Only PAM
    session-open events (su, sshd login, etc.) reach it.
- rule: 110201 (pdp_fim.xml)
  finding: >-
    Used if_group "syscheck", which the built-in rule 515 also applies to
    rootcheck/OpenSCAP/CIS-CAT/Azure-logs scan start/end housekeeping
    messages, causing false-positive alerts on every scan cycle.
  fix: Changed to if_group "syscheck_file" (only real per-file add/modify/delete events).
- rule: 110202 (pdp_fim.xml)
  finding: >-
    Checked field name "type", which does not exist on the decoded alert
    (confirmed via a live delete event's full JSON); the rule never fired.
  fix: Changed to decoded_as "syscheck_deleted", matching how the built-in rule 553 identifies deletions.
- file: implementations/wazuh/shared/pdp-linux-baseline/agent.conf
  finding: >-
    Contained a <syscollector> block, which Wazuh 4.14.7 rejects inside a
    centralized/shared agent.conf ("Invalid element in the configuration:
    'syscollector'"). This single invalid element invalidated the ENTIRE
    agent.conf for the group -- labels, syscheck, and sca all silently
    stopped applying too, not just syscollector.
  fix: Removed the <syscollector> block (must be configured locally per agent instead).
- component: implementations/wazuh/tests/harness/run_api_logtest.py
  finding: >-
    Passed the Wazuh API's decoder object ({"name": "pdp-pgaudit", ...})
    straight through into evidence test.decoder, which
    framework/schemas/evidence.schema.json requires to be a string or
    null. Confirmed via schema validation of the generated evidence
    (rule-matching itself was already correct, all 13 cases PASS).
  fix: 'Changed to (output.get("decoder") or {}).get("name").'
- component: tools/assessment/WAZUH_EVIDENCE_MAPPING.yml
  finding: >-
    WZ-RUL-PG-005's default_event_context.technical_priority held a
    legal-disclaimer sentence instead of a priority level (LOW/MEDIUM/
    HIGH). Not currently consumed by any script, so latent rather than
    active, but a real data-quality defect.
  fix: 'Set technical_priority: HIGH (matching sibling entries); moved the disclaimer text to a comment.'
- issue: >-
    pdp_linux_baseline.yml SCA policy previously produced zero usable
    results (result=not applicable on all 6 checks) when distributed via
    a centralized agent group. Initially misdiagnosed as
    sca.remote_commands=0 blocking c:<command> execution for
    group-pushed policies.
  root_cause: >-
    Not a remote_commands restriction. The test agent (pdp-agent-test, a
    minimal Docker container with no init system) never had sshd or
    systemctl installed at all. Confirmed by direct inspection (neither
    binary existed on disk) and by observing that Wazuh's own vendor
    cis_ubuntu24-04.yml policy failed with the identical error on the
    same commands on the same agent. sca.remote_commands=1 was already
    set correctly and was never the actual blocker.
  fix: >-
    Installed openssh-server (which transitively provided systemctl via
    systemd/libpam-systemd) and started sshd in the test container. After
    a clean agent restart, all 6 checks returned genuine PASS/FAIL
    results via the centralized group-pushed policy.
  status: RESOLVED
  evidence: release/runtime-validation/wazuh-4.14.7/SCA_EVIDENCE_2026-09-23.md (addendum section)
not_yet_covered:
- SCA check-ID collision against genuinely third-party/custom SCA content
