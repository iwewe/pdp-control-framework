metadata:
  version: 1.0.0
  introduced_in_draft: '0.9.0'
  title: PDP Continuous Control Dashboard
  indices:
  - pdp-evidence-*
  - pdp-assessment-*
  - pdp-findings-*
  - pdp-legal-review*
  principle: Dashboard reports engineering control/evidence state, not a legal compliance score.
filters:
- scope.processing_activity_id
- scope.asset_ids
- control_id
- result
- evidence_health
- severity
- status
- legal_review_state
- category
panels:
- id: PDP-DASH-001
  title: Control Assessment State
  index: pdp-assessment-*
  type: metric+distribution
  metrics:
  - count
  buckets:
  - result
  notes: Show PASS/FAIL/REVIEW/NOT_APPLICABLE counts. Do not label as legal compliance percentage.
- id: PDP-DASH-002
  title: Evidence Health
  index: pdp-assessment-*
  type: pie
  buckets:
  - evidence_health
- id: PDP-DASH-003
  title: Open Findings by Severity
  index: pdp-findings-*
  type: bar
  filter: 'status: OPEN OR status: IN_PROGRESS'
  buckets:
  - severity
- id: PDP-DASH-004
  title: Findings by Processing Activity
  index: pdp-findings-*
  type: table
  buckets:
  - scope.processing_activity_id
  - control_id
  - severity
  - status
  - legal_review_state
  notes: legal_review_state surfaces the finding-level "Review Queue" concept (UI_POSITIONING.md section 7.D) directly in this table.
- id: PDP-DASH-005
  title: Controls Requiring Review
  index: pdp-assessment-*
  type: table
  filter: 'result: REVIEW'
  buckets:
  - scope.processing_activity_id
  - control_id
  - evidence_health
  - coverage.coverage_percent
- id: PDP-DASH-006
  title: Evidence Quality Distribution
  index: pdp-evidence-*
  type: bar
  buckets:
  - quality.level
- id: PDP-DASH-007
  title: PDP Event Categories Over Time
  index: pdp-evidence-*
  type: timeseries
  time_field: '@timestamp'
  buckets:
  - event.taxonomy_ids
- id: PDP-DASH-008
  title: Technical Traceability
  index: pdp-evidence-*
  type: table
  buckets:
  - test.id
  - traceability.requirements
  - traceability.controls
  - traceability.legal_requirements
- id: PDP-DASH-009
  title: Legal / Manual Review Queue
  index: pdp-legal-review*
  type: table
  buckets:
  - category
  - status
  - legal_requirement_id
  notes: >-
    Legal requirements with no Wazuh technical coverage (UI_POSITIONING.md
    section 7.D), so a DPO/legal reviewer can see and work through them
    directly in this dashboard rather than only in the repository. Not a
    dashboard-native review workflow: status/reviewer/notes are edited in
    framework/legal/review/LEGAL_REVIEW_QUEUE_STATUS.yml and reindexed via
    tools/export/export_legal_review_ndjson.py, not from this panel.
    Full text of each requirement: reports/LEGAL_REVIEW_QUEUE.md.
