version: 1.0.0
review_date: '2026-09-22'
scope: UU 27/2022 Articles 20-56 + MK 151/PUU-XXII/2024
authoritative_text_review: COMPLETE
requirements_source_verified: 64
external_legal_counsel_review: NOT_PERFORMED
constitutional_court_interpretation_applied: true
implementing_regulations:
  status: NOT_REVIEWED
  note: >-
    UU No. 27 Tahun 2022 itself mandates implementing government
    regulations (Peraturan Pemerintah) within its transitional period.
    As of this review (2026-09-22), this framework has not confirmed
    whether any such implementing regulation has been enacted, and none
    is incorporated into framework/legal/LEGAL_MAPPING.yml. This is an
    explicit open item, not an assumption of "none exists" -- whoever
    next reviews the legal mapping should check the authoritative source
    (jdih.komdigi.go.id or peraturan.bpk.go.id) for any enacted
    implementing regulation before treating LEGAL_MAPPING.yml as
    complete for a 1.0 release.
release_gate:
  source_text_review: PASS
  independent_legal_review: OPEN_ACCEPTED_EXCEPTION
  implementing_regulations_review: OPEN_ACCEPTED_EXCEPTION
release_exception:
  decided_by: project_owner
  decision_date: '2026-09-24'
  decision: >-
    Proceed toward 0.10.0-rc2 -> 1.0 without independent external legal
    counsel review and without an independent re-check for enacted
    implementing regulations (Peraturan Pemerintah). The completed
    authoritative-text review is treated as sufficient current legal
    guidance for this release. See
    release/PRE_1_0_CHECKLIST.md section H "Documented release
    exceptions" for the formal record. This decision applies to this
    release only and should be re-affirmed or revisited for any future
    major release.
