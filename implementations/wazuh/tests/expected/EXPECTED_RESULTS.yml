metadata:
  version: 0.10.0-rc2
  introduced_in_draft: '0.7.0'
  purpose: Expected lab outcomes. Exact decoder/rule behavior must be confirmed on real Wazuh.
fixtures:
- file: postgresql/pgaudit_role_create.log
  expected_decoder: pdp-pgaudit
  expected_rule_id: 110402
  expected_fields:
    pdp.audit_class: ROLE
    pdp.command: CREATE ROLE
- file: postgresql/pgaudit_ddl_alter_table.log
  expected_decoder: pdp-pgaudit
  expected_rule_id: 110403
  expected_fields:
    pdp.audit_class: DDL
    pdp.command: ALTER TABLE
    pdp.object_name: public.employee
- file: postgresql/pgaudit_write_update.log
  expected_decoder: pdp-pgaudit
  expected_rule_id: 110404
  expected_fields:
    pdp.audit_class: WRITE
    pdp.command: UPDATE
    pdp.object_name: public.employee
- file: postgresql/pgaudit_read_select.log
  expected_decoder: pdp-pgaudit
  expected_rule_id: 110405
  expected_fields:
    pdp.audit_class: READ
    pdp.command: SELECT
    pdp.object_name: public.employee
- file: postgresql/pgaudit_repeated_read_20.log
  expected_decoder: pdp-pgaudit
  expected_rule_id: 110406
  session_required: true
  notes: Correlation test; all lines must be fed into the same wazuh-logtest session.
- file: authentication/ssh_failed_once.log
  expected_rule_id: 110001
  notes: Depends on Wazuh built-in sshd/authentication decoder and group.
- file: authentication/ssh_failed_8.log
  expected_rule_id: 110002
  session_required: true
  notes: Correlation test; all lines must be fed into the same wazuh-logtest session.
- file: privileged_access/su_session_opened.log
  expected_rule_id: 110101
  notes: >-
    Depends on Wazuh built-in PAM rule 5501 ("session opened for user"),
    which carries the authentication_success group. Confirmed on real
    Wazuh 4.14.7, 2026-09-23: a sudo command-execution log line (built-in
    rules 5400-5407) does NOT carry authentication_success and therefore
    never fires 110101, even though "sudo" is one of the regex keywords in
    the PDP rule -- only PAM session-open events (su, sshd login, etc.)
    reach it in practice.
- file: privileged_access/su_session_repeated_3.log
  expected_rule_id: 110102
  session_required: true
  notes: Correlation test (frequency=3, timeframe=300); all lines must be fed into the same wazuh-logtest session.
- file: telemetry_health/agent_disconnected.log
  expected_rule_id: 110301
  notes: >-
    Generic <match> rule with no if_group/if_sid/decoded_as precondition,
    so it can be preempted by ANY other rule that claims the log first.
    Confirmed on real Wazuh 4.14.7, 2026-09-23: a line using "audit:" as
    the syslog program tag was instead claimed by built-in rule 6100
    ("Solaris BSM Auditing messages grouped", decoded_as solaris_bsm) at
    level 0, and 110301 was never even attempted -- not a bug in this
    rule, but a reminder that its coverage depends on no other decoder/
    rule matching first. Use a program tag that does not collide with any
    built-in decoder.
- file: telemetry_health/agent_inactive.log
  expected_rule_id: 110301
- file: telemetry_health/collector_stopped.log
  expected_rule_id: 110301
- file: telemetry_health/logging_stopped.log
  expected_rule_id: 110301
