bugs_found_and_fixed_in_this_lab_pass:
- component: release/runtime-validation/dashboard/validate_real_import.py
  finding: >-
    Unconditionally sent a securitytenant: global header, which breaks
    every dashboard saved-objects request (even as admin/all_access) when
    opensearch_security.multitenancy.enabled is false (Wazuh's own
    default). Confirmed via raw curl before/after.
  fix: Added PDP_MULTITENANCY_ENABLED env var (default false); only sends the header when explicitly true.
- component: implementations/wazuh/indexer/templates/pdp-evidence-template.json
  finding: >-
    Missing observed_at (schema-required), collected_at, event.raw_reference,
    review.reviewer, review.notes, and the entire payload object. Under
    dynamic:strict this rejected every genuinely schema-valid evidence
    document, including the committed examples/evidence.example.json.
  fix: >-
    Added the missing scalar fields; mapped payload as
    {"type":"object","enabled":false} since
    framework/schemas/evidence.schema.json intentionally marks it
    additionalProperties:true (its shape varies per evidence-producing
    engine).
- component: implementations/wazuh/indexer/templates/pdp-assessment-template.json
  finding: Missing notes field.
  fix: Added notes (text).
- component: implementations/wazuh/indexer/templates/pdp-findings-template.json
  finding: Missing notes field.
  fix: Added notes (text).
rbac_v3:
  status: LIVE_TESTED_PASS
  history: >-
    v1 (pdp_dashboard_editor could not access saved objects at all) ->
    v2 (fixed cluster_composite_ops and .kibana* actions per OpenSearch
    Security's reference kibana_user role; still failed live, including
    reads, for both roles) -> v3 (root cause found via OpenSearch
    Security DEBUG logging: the Kibana-multitenancy interceptor requires
    an explicit tenant_permissions grant for the "global_tenant" tenant
    regardless of the Dashboards-side multitenancy.enabled flag; neither
    v1 nor v2 declared any tenant_permissions).
  fix: >-
    Added tenant_permissions (tenant_patterns: ["global_tenant"],
    allowed_actions: ["kibana_all_read"] for the viewer /
    ["kibana_all_write"] for the editor) to both roles.
  result: >-
    All 8 test scenarios passed: viewer/editor read pdp-* (200), write
    pdp-* denied (403), viewer/editor can open the dashboard via the real
    /api/saved_objects/_find API (200, all 8 panels visible), viewer
    cannot save a visualization (403), editor can save a visualization
    (200/201, then deleted as test cleanup).
  cleanup: >-
    Test users (pdp_viewer_test, pdp_editor_test), test index
    (pdp-evidence-rbactest), and the test visualization were removed
    after verification. The pdp_dashboard_viewer/pdp_dashboard_editor
    roles and pdp_viewer/pdp_editor role mappings were deliberately left
    live as the actual deliverable feature.
  evidence: release/runtime-validation/dashboard/RBAC_EVIDENCE_2026-09-24.md
operational_risks_confirmed:
- risk: >-
    Imported dashboard saved objects (index patterns, dashboard) do not
    reliably survive a wazuh-dashboard service restart, especially the
    first restart after a wazuh-dashboard package upgrade. Observed
    directly in this lab: objects present and discoverable at 17:12 WIB,
    gone (dashboard count 0, no pdp-* index patterns) after a dashboard
    restart at 17:38 WIB. The .kibana_1 index itself was not recreated
    (same UUID before/after) -- this was a saved-objects-level loss, not
    an index rebuild. Re-importing the same NDJSON restored everything
    cleanly both times tested.
  mitigation: >-
    Back up saved objects before any wazuh-dashboard restart/upgrade, and
    verify + reimport afterward. See implementations/wazuh/DEPLOYMENT.md
    section 4.
not_yet_covered:
- Actual browser rendering of the 8 panels (verified via saved-objects/search APIs, not a real browser session).
- Behavior once each index holds a realistic document volume (tested with 1 doc per index).
- Behavior with opensearch_security.multitenancy.enabled: true (RBAC v3 was tested with it disabled, the framework default).
- Whether saved objects survive a wazuh-dashboard restart when NOT preceded by a package upgrade (not isolated/tested separately).
- SSO/external identity provider mapping to the RBAC backend roles (out of scope for this pass; see roles.yml README "Scope and limitations").
