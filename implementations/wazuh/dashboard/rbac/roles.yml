# PDP Control Framework -- OpenSearch Security role definitions for the
# compliance dashboard.
#
# These are additive snippets, not a full roles.yml. Append them to the
# target Wazuh Indexer's existing
# /etc/wazuh-indexer/opensearch-security/roles.yml (do not replace the
# file -- it already defines Wazuh's own required reserved roles).
#
# Design intent:
# - Both roles are read-only on PDP data indices (pdp-evidence-*,
#   pdp-assessment-*, pdp-findings-*, matched by "pdp-*"). Compliance
#   evidence/assessments/findings are produced by the pipeline
#   (tools/assessment/, tools/findings/) and must never be hand-edited
#   from the dashboard by a viewer or an editor -- editing rights only
#   ever extend to dashboard saved objects (visualizations, dashboards),
#   never to the underlying data.
# - This is a least-privilege model: a compliance stakeholder using this
#   dashboard has no need for and gets no access to Wazuh's own SIEM
#   indices (wazuh-alerts-*, wazuh-monitoring-*, etc.) or to any other
#   tenant's data.
#
# STATUS (2026-09-24): v3, live-tested successfully end to end. See
# release/runtime-validation/dashboard/RBAC_EVIDENCE_2026-09-24.md for
# the full v1 -> v2 -> v3 history. Summary of what v1/v2 got wrong and
# why v3 fixes it:
#
# v1 used "cluster_composite_ops_ro" and plain "crud" on .kibana*, with
# empty tenant_permissions on both roles. Neither role could use the
# Dashboards saved-objects application layer at all (the viewer couldn't
# even open the dashboard).
#
# v2 fixed the cluster permission (-> "cluster_composite_ops", matching
# OpenSearch Security's own reference "kibana_user" role:
# https://github.com/opensearch-project/security/blob/main/src/main/resources/static_config/static_roles.yml)
# and widened the editor's .kibana* actions to
# ["delete","index","manage","read"], and gave the viewer a read-only
# .kibana*/.kibana_* grant it was missing entirely in v1. This fixed nothing
# by itself in live testing -- every saved-objects call still failed.
#
# v3 (this version) found the real root cause via OpenSearch Security
# DEBUG logging (logger.org.opensearch.security=DEBUG, reverted after
# diagnosis): the security plugin's Kibana-multitenancy interceptor
# intercepts every request touching .kibana*-pattern indices REGARDLESS
# of whether opensearch_dashboards.yml has multitenancy.enabled: true or
# false, and logged exactly:
#
#   WARN PrivilegesInterceptorImpl: Tenant global_tenant is not allowed
#   for user <user>
#
# Neither role had any tenant_permissions at all. Reserved/static roles
# like "kibana_user" apparently get the global tenant implicitly; custom
# roles do not and must declare it explicitly. Adding an explicit
# tenant_permissions grant for the "global_tenant" tenant pattern
# (kibana_all_read for the viewer, kibana_all_write for the editor) fixed
# every previously-failing check. Live-tested end to end 2026-09-24:
# viewer can open the dashboard and cannot save changes; editor can open
# the dashboard and can create/save a visualization; neither can write to
# pdp-* data under any circumstance. All 8 test scenarios in README.md
# passed.

# Read-only: can open the PDP dashboard and view its panels. Cannot save
# changes to any dashboard/visualization, and cannot write to any index.
pdp_dashboard_viewer:
  reserved: false
  cluster_permissions:
  - "cluster_composite_ops"
  index_permissions:
  - index_patterns:
    - "pdp-*"
    allowed_actions:
    - "read"
    - "indices:admin/mappings/get"
  - index_patterns:
    - ".kibana"
    - ".kibana_*"
    allowed_actions:
    - "read"
    - "indices:admin/mappings/get"
  tenant_permissions:
  - tenant_patterns:
    - "global_tenant"
    allowed_actions:
    - "kibana_all_read"

# Editor: same read-only access to PDP data as the viewer, plus CRUD +
# index-management on saved objects (.kibana*) so dashboards/
# visualizations can be built and maintained. Deliberately has NO write
# access to pdp-evidence-*, pdp-assessment-*, or pdp-findings-* -- see
# design intent above.
pdp_dashboard_editor:
  reserved: false
  cluster_permissions:
  - "cluster_composite_ops"
  index_permissions:
  - index_patterns:
    - "pdp-*"
    allowed_actions:
    - "read"
    - "indices:admin/mappings/get"
  - index_patterns:
    - ".kibana"
    - ".kibana_*"
    allowed_actions:
    - "delete"
    - "index"
    - "manage"
    - "read"
  tenant_permissions:
  - tenant_patterns:
    - "global_tenant"
    allowed_actions:
    - "kibana_all_write"
